[workspace]
members = ["rock-snapd-cli", "rust/rock-snapd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
aws-sdk-s3 = { version = "=1.96.0", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-runtime = { version = "=1.10.0", features = ["client", "connector-hyper-0-14-x", "tls-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
libc = "0.2.177"
nix = { version = "=0.29.0", features = ["fs", "socket", "uio"] }
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }
hyper = { version = "0.14.32", features = ["client", "http1", "server", "tcp"] }
flate2 = "=1.1.5"
tar = "=0.4.44"
lz4-sys = "=1.11.1"
crc32c = "=0.6.8"
hyper-rustls = { version = "=0.24.2", default-features = false, features = ["native-tokio", "http1", "tls12"] }
url = "=2.5.8"
