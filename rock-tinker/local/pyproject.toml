# Isolated environment for the bundled Tinker SDK/backend and local cookbook.
# ROCK's default requirements, extras and package indexes are independent.
[project]
name = "tinker-local-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "rl-rock",
    "psutil",
    "huggingface-hub>=1.16,<2",
    "httpx[http2,zstd]>=0.28,<1",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.14,<5",
    "anyio>=4.10,<5",
    "chz>=0.4,<0.5",
    "distro>=1.9,<2",
    "sniffio>=1.3,<2",
    "protobuf>=5.29,<7",
    "pyyaml>=6.0.3,<7",
    "orjson>=3.11,<4",
    "pillow>=12,<13",
    "transformers>=5.9,<6",
    "rich>=14,<15",
    "termcolor>=3,<4",
    "click>=8,<9",
    "pip>=25,<27",
    "python-dotenv>=1.1,<2",
    "alembic",
    "aiosqlite",
    "asyncpg",
    "fastapi",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
    "zstandard>=0.23,<1",
    "numpy>=2.1,<=2.2.6",
    "pexpect; sys_platform != 'win32'",
    "bashlex; sys_platform != 'win32'",
    "twisted; sys_platform != 'win32'",
]

[dependency-groups]
sandbox = [
    "harbor==0.24.0",
    "litellm==1.104.0",
    "openai>=2.20,<3",
]
control = [
    {include-group = "sandbox"},
    "ray[default]==2.43.0",
    "redis==7.2.0",
    "apscheduler",
    "websockets>=15.0.1",
    "aiohttp>=3.12.15",
    "alibabacloud_cr20181201==2.0.5",
    "sqlmodel",
    "psycopg2-binary",
    "boto3",
    "cryptography==39.0.1",
    "fakeredis[json]",
    "kubernetes>=35.0.0",
    "opensandbox>=0.1.13",
    "aiolimiter>=1.2.1",
    "httptools",
    "uvloop",
    "torch>=2.12,<3",
    "nacos-sdk-python==0.1.14",
    "omegaconf",
    "hydra-core",
    "dacite",
    "datasets",
    "pandas",
    "plotly",
]

[tool.uv]
package = false
default-groups = []

[tool.uv.sources]
rl-rock = {path = "../..", editable = true}
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
